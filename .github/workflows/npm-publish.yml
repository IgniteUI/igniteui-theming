name: Npm.js deploy

permissions:
  id-token: write
  contents: read

on:
  release:
    types: [created]

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Lint package
        run: npm run lint

      - name: Build package
        run: npm run build
        env:
          MCP_VERSION: ${{ env.VERSION }}

      - name: Test package
        run: npm test

      - name: Define NPM tag
        run: |
          if [[ ${VERSION} == *"alpha"* || ${VERSION} == *"beta"* || ${VERSION} == *"rc"* ]]; then
            echo "NPM_TAG=next"
          elif [[ ${VERSION} == *"patch"* ]]; then
            echo "NPM_TAG=patch"
          else
            echo "NPM_TAG=latest"
          fi >> $GITHUB_ENV
          echo ${NPM_TAG}

      - name: Create package version
        run: npm version ${VERSION/-patch/} --no-git-tag-version --save --allow-same-version
        working-directory: packages/theming

      - name: Publish igniteui-theming
        run: npm publish --tag ${NPM_TAG} --provenance
        working-directory: packages/theming

      - name: Stamp server.json version
        if: env.NPM_TAG != 'next'
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION.replace("-patch", "");
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            s.version = v;
            s.packages[0].version = v;
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n");
          '

      - name: Publish to MCP Registry
        if: env.NPM_TAG != 'next'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar -xz -f - mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
