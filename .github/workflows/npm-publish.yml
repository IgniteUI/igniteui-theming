name: Npm.js deploy

permissions:
  id-token: write
  contents: read

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already published to npm to register in the MCP Registry (e.g. 29.1.1)'
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Lint package
        run: npm run lint

      - name: Build package
        run: npm run build
        env:
          MCP_VERSION: ${{ env.VERSION }}

      - name: Test package
        run: npm test

      - name: Define NPM tag
        run: |
          if [[ ${VERSION} == *"alpha"* || ${VERSION} == *"beta"* || ${VERSION} == *"rc"* ]]; then
            echo "NPM_TAG=next"
          elif [[ ${VERSION} == *"patch"* ]]; then
            echo "NPM_TAG=patch"
          else
            echo "NPM_TAG=latest"
          fi >> $GITHUB_ENV
          echo ${NPM_TAG}

      - name: Create package version
        run: npm version ${VERSION/-patch/} --no-git-tag-version --save --allow-same-version
        working-directory: packages/theming

      - name: Publish igniteui-theming
        run: npm publish --tag ${NPM_TAG} --provenance
        working-directory: packages/theming

  # Kept separate so it can be retried without republishing to npm
  mcp-registry:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Normalize version
        run: |
          VERSION=${VERSION#v}
          VERSION=${VERSION/-patch/}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          if [[ ${VERSION} == *"alpha"* || ${VERSION} == *"beta"* || ${VERSION} == *"rc"* ]]; then
            echo "SKIP_REGISTRY=true" >> $GITHUB_ENV
            echo "Prerelease ${VERSION}: not registering in the MCP Registry"
          fi

      - name: Wait for npm to serve the version
        if: env.SKIP_REGISTRY != 'true'
        run: |
          for i in $(seq 1 40); do
            if [[ "$(npm view "igniteui-theming@${VERSION}" version 2>/dev/null)" == "${VERSION}" ]]; then
              echo "igniteui-theming@${VERSION} is available on npm"
              exit 0
            fi
            echo "Attempt ${i}: igniteui-theming@${VERSION} not visible yet, waiting 15s..."
            sleep 15
          done
          echo "::error::igniteui-theming@${VERSION} did not appear on npm within 10 minutes"
          exit 1

      - name: Stamp server.json version
        if: env.SKIP_REGISTRY != 'true'
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            s.version = v;
            s.packages[0].version = v;
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n");
          '

      - name: Publish to MCP Registry
        if: env.SKIP_REGISTRY != 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar -xz -f - mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher login github-oidc

          for i in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Publish attempt ${i} failed, retrying in $((i * 30))s..."
            sleep $((i * 30))
          done
          echo "::error::Failed to publish ${VERSION} to the MCP Registry"
          exit 1
