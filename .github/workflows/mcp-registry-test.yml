# Temporary workflow for validating the MCP registry publish path.
#
# The release workflow only runs `on: release`, so the OIDC namespace claim
# can't be exercised without cutting a version. This runs the same two steps
# on demand, against the staging registry by default.
#
# Delete this file once the production publish has succeeded once.

name: MCP registry publish (test)

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Must already exist on npm AND carry the mcpName field.'
        required: true
      registry:
        description: 'Registry to publish to'
        required: true
        default: 'https://staging.registry.modelcontextprotocol.io'
        type: choice
        options:
          - 'https://staging.registry.modelcontextprotocol.io'
          - 'https://registry.modelcontextprotocol.io'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp server.json version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION.replace("-patch", "");
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            s.version = v;
            s.packages[0].version = v;
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n");
          '
          cat server.json

      - name: Download MCP Publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar -xz -f - mcp-publisher
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc --registry "${{ inputs.registry }}"
          ./mcp-publisher publish

      - name: Verify listing
        run: |
          curl -sf "${{ inputs.registry }}/v0/servers?search=igniteui-theming" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                const r = JSON.parse(d).servers.map(s => ({
                  version: s.server.version,
                  npm: s.server.packages?.[0]?.version,
                  isLatest: s._meta["io.modelcontextprotocol.registry/official"].isLatest,
                }));
                console.table(r);
              })'
