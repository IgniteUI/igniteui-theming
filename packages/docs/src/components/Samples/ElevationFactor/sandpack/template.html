<article data-theme="__COLOR_MODE__">
  <section class="button-wrapper">
    <button>
      --ig-elevation-factor: <span id="current-value">1</span>
    </button>
  </section>
  <section class="text-wrapper">
    <p>Move the slide to see how the different elevation factor affects the
      applied elevation.</p>
    <input id="slider" type="range" min="-3" max="5" value="1" step="0.5" aria-label="Elevation factor" />
  </section>
</article>
