<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Every demo, under a hostile stylesheet</title>
<!-- None of these rules should show inside a demo: each draws in its own shadow root. -->
<style>
  body { font-family: Georgia, serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #222; background: #fffdf5; }
  button { background: hotpink !important; border: 4px dashed lime !important; }
  h3 { font-size: 40px; color: purple; }
  code { background: yellow; }
  .swatch, .strip, .row { display: none !important; }
  :root { --ink: red; --line: red; --panel: black; }
  h2 { margin-block: 56px 16px; font: 600 18px/1.3 system-ui, sans-serif; }
  h2 code { font-weight: 400; }
</style>
<script type="module" src="{{script}}"></script>
</head>
<body>
<h1>Every demo, under a hostile stylesheet</h1>
<p><a href="./">All pages</a></p>
{{demos}}
</body>
</html>
